<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=check_circle" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
<div class="container-fluid">

<div class="container-1">
    <form action="#">
        <h3>Student Registration Form</h3>
        <div class="input-group">
            <div>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your Name" id="user-name" onkeyup="validateName()">
            </div>
            <span id="name-error"></span>
        </div>
        <div class="input-group">
            <div>

            <label>Phone No.</label>
            <input type="tel" placeholder="123 456 7890" id="user-phone" onkeyup="validatePhone()">
            </div>
            <span id="phone-error"></span>
        </div>
        <div class="input-group">
            <div>

            <label>Email Id</label>
            <input type="email" placeholder="Enter Your Email" id="user-email" onkeyup="validateEmail()">
            </div>
            <span id="email-error"></span>
        </div>
        <div class="input-group">
            <div>

            <label>Password</label>
            <input type="password" placeholder="Create a Password" id="user-password" onkeyup="validatePassword()">
            </div>
            <span id="password-error"></span>
        </div>

        <div>
            <button id="submit" onclick="validateForm()">Submit</button>
            <span id="submit-error"></span>
        </div>
        <button class="home-button"><a href="home.html" style="text-decoration: none; color: black;"> Go to home page</a></button>
    </form>
</div>
</div>
<script src="../js/jquery-3.7.1.js"></script>
<script src="../js/script.js"></script>
</body>
</html>
